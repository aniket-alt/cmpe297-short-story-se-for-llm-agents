<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="520" viewBox="0 0 1150 520" font-family="DejaVu Sans, system-ui, sans-serif">
  <rect width="1150" height="520" fill="#fcfcfb"/>
  <text x="36" y="46" font-size="23" font-weight="bold" fill="#0b0b0b">What each stage means in an agent context</text>
  <text x="36" y="72" font-size="13.5" fill="#898781">The engineering concerns the survey searched for, stage by stage.</text>

  <line x1="36" y1="96" x2="1114" y2="96" stroke="#c3c2b7" stroke-width="2"/>
  <text x="36" y="118" font-size="12" font-weight="bold" fill="#898781" letter-spacing="1">STAGE</text>
  <text x="330" y="118" font-size="12" font-weight="bold" fill="#898781" letter-spacing="1">WHAT THE SURVEY WENT LOOKING FOR</text>
  <line x1="36" y1="130" x2="1114" y2="130" stroke="#e1e0d9" stroke-width="1.5"/>

  <g font-size="13.5" fill="#52514e">
    <text x="36" y="160" font-size="14.5" font-weight="bold" fill="#eb6834">Requirements</text>
    <text x="36" y="179" font-size="14.5" font-weight="bold" fill="#eb6834">Engineering</text>
    <text x="330" y="160">intended behaviour, constraints, acceptance conditions,</text>
    <text x="330" y="179">stakeholder needs, action boundaries</text>
    <line x1="36" y1="198" x2="1114" y2="198" stroke="#e1e0d9" stroke-width="1"/>

    <text x="36" y="228" font-size="14.5" font-weight="bold" fill="#0b0b0b">Architecture</text>
    <text x="36" y="247" font-size="14.5" font-weight="bold" fill="#0b0b0b">&amp; Design</text>
    <text x="330" y="228">decomposition, responsibilities, interfaces, contracts,</text>
    <text x="330" y="247">interaction topology, reference architectures, design patterns</text>
    <line x1="36" y1="266" x2="1114" y2="266" stroke="#e1e0d9" stroke-width="1"/>

    <text x="36" y="296" font-size="14.5" font-weight="bold" fill="#0b0b0b">Implementation</text>
    <text x="36" y="315" font-size="14.5" font-weight="bold" fill="#0b0b0b">&amp; Integration</text>
    <text x="330" y="296">construction, configuration, debugging, frameworks, SDKs,</text>
    <text x="330" y="315">harnesses, protocols, orchestration, tool and environment integration</text>
    <line x1="36" y1="334" x2="1114" y2="334" stroke="#e1e0d9" stroke-width="1"/>

    <text x="36" y="364" font-size="14.5" font-weight="bold" fill="#184f95">Testing</text>
    <text x="36" y="383" font-size="14.5" font-weight="bold" fill="#184f95">&amp; Assurance</text>
    <text x="330" y="364">test models, generation, oracles, coverage, benchmarks, verification,</text>
    <text x="330" y="383">validation, reliability, safety, failure diagnosis, regression</text>
    <line x1="36" y1="402" x2="1114" y2="402" stroke="#e1e0d9" stroke-width="1"/>

    <text x="36" y="432" font-size="14.5" font-weight="bold" fill="#0b0b0b">Maintenance</text>
    <text x="36" y="451" font-size="14.5" font-weight="bold" fill="#0b0b0b">&amp; Evolution</text>
    <text x="330" y="432">deployment, observability, monitoring, incident analysis, repair, rollback,</text>
    <text x="330" y="451">impact analysis, version management, controlled adaptation, re-validation</text>
    <line x1="36" y1="470" x2="1114" y2="470" stroke="#c3c2b7" stroke-width="2"/>
  </g>

  <text x="36" y="498" font-size="11.5" fill="#898781">Search scope from Ge et al., arXiv:2611.23260</text>
</svg>
