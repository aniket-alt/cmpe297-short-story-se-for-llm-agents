<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="DejaVu Sans, system-ui, sans-serif">
  <rect width="1200" height="480" fill="#fcfcfb"/>
  <text x="36" y="46" font-size="23" font-weight="bold" fill="#0b0b0b">What the major agent leaderboards actually measure</text>
  <text x="36" y="72" font-size="13.5" fill="#898781">Point-in-time snapshots from public leaderboards. Scores move weekly; the boards genuinely disagree.</text>

  <line x1="36" y1="98" x2="1164" y2="98" stroke="#c3c2b7" stroke-width="2"/>
  <g font-size="12" font-weight="bold" fill="#898781" letter-spacing="1">
    <text x="36" y="120">BENCHMARK</text>
    <text x="276" y="120">WHAT IT TESTS</text>
    <text x="656" y="120">SCALE</text>
    <text x="966" y="120">SCORING</text>
  </g>
  <line x1="36" y1="132" x2="1164" y2="132" stroke="#e1e0d9" stroke-width="1.5"/>

  <g font-size="13.5" fill="#52514e">
    <text x="36" y="162" font-weight="bold" fill="#0b0b0b">SWE-bench Verified</text>
    <text x="276" y="162">Repository-level issue resolution</text>
    <text x="656" y="162">500 human-filtered GitHub issues</text>
    <text x="966" y="162">% resolved by tests</text>
    <line x1="36" y1="180" x2="1164" y2="180" stroke="#e1e0d9" stroke-width="1"/>

    <text x="36" y="210" font-weight="bold" fill="#0b0b0b">SWE-bench Pro</text>
    <text x="276" y="210">Harder, broader repositories</text>
    <text x="656" y="210">public + held-out splits</text>
    <text x="966" y="210">resolve rate</text>
    <line x1="36" y1="228" x2="1164" y2="228" stroke="#e1e0d9" stroke-width="1"/>

    <text x="36" y="258" font-weight="bold" fill="#0b0b0b">GAIA</text>
    <text x="276" y="258">Tool-using general assistance</text>
    <text x="656" y="258">466 questions, 300 held out</text>
    <text x="966" y="258">answer match</text>
    <line x1="36" y1="276" x2="1164" y2="276" stroke="#e1e0d9" stroke-width="1"/>

    <text x="36" y="306" font-weight="bold" fill="#0b0b0b">tau-bench / tau&#178;</text>
    <text x="276" y="306">Policy-bound customer-service tool use</text>
    <text x="656" y="306">165 tasks (115 retail, 50 airline)</text>
    <text x="966" y="306" font-weight="bold" fill="#2a78d6">state match, pass^k</text>
    <line x1="36" y1="324" x2="1164" y2="324" stroke="#e1e0d9" stroke-width="1"/>

    <text x="36" y="354" font-weight="bold" fill="#0b0b0b">OSWorld</text>
    <text x="276" y="354">GUI / computer use</text>
    <text x="656" y="354">369 tasks on a real OS</text>
    <text x="966" y="354">task success</text>
    <line x1="36" y1="372" x2="1164" y2="372" stroke="#e1e0d9" stroke-width="1"/>

    <text x="36" y="402" font-weight="bold" fill="#0b0b0b">Terminal-Bench</text>
    <text x="276" y="402">Command-line task completion</text>
    <text x="656" y="402">&#8212;</text>
    <text x="966" y="402">task success</text>
    <line x1="36" y1="420" x2="1164" y2="420" stroke="#c3c2b7" stroke-width="2"/>
  </g>

  <text x="36" y="452" font-size="12.5" fill="#52514e">GAIA and OSWorld-Verified now sit above their published human baselines &#8212; they no longer separate frontier agents.</text>
</svg>
